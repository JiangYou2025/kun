{% include fviz/base.html %}
<div class="fviz" id="fv-batchsize" markdown="0">
<h4 data-t="title"></h4>
<p class="hint" data-t="hint"></p>
<canvas></canvas>
<div class="ctl">
  <label><span>batch size</span><input type="range" data-k="b" min="0" max="8" step="1" value="2"></label>
  <span data-g="mode"><button data-v="ep" class="on" data-t="ep"></button><button data-v="up" data-t="up"></button></span>
  <button data-k="shuf" data-t="shuf"></button>
</div>
<p class="out" data-k="out"></p>
<script>
(function () {
  var T = {
    zh: { title: '🎲 batch size：更新频率与梯度噪声的权衡', hint: '用 mini-batch SGD 拟合一条直线 y = w·x + b（256 个样本），图上是参数 (w, b) 在损失等高线上的轨迹，★ 是最优解。小 batch：一个 epoch 内更新很多次，但每步方向抖动；大 batch：每步很稳，但一个 epoch 只更新寥寥几次。切换“同样 2 个 epoch”与“同样 40 次更新”对比两种代价。', ep: '同样 2 个 epoch', up: '同样 40 次更新', shuf: '重新打乱', it: '每个 epoch 的迭代数', upd: '参数更新次数', seen: '用掉的样本数', loss: '最终损失', min: '最优', start: '起点' },
    en: { title: '🎲 Batch size: update frequency vs gradient noise', hint: 'Mini-batch SGD fits a line y = w·x + b to 256 samples; the plot shows the path of the parameters (w, b) over the loss contours, ★ is the optimum. Small batches update many times per epoch but every step wobbles; large batches take very steady steps but only a handful per epoch. Switch between “same 2 epochs” and “same 40 updates” to compare the two costs.', ep: 'same 2 epochs', up: 'same 40 updates', shuf: 'reshuffle', it: 'iterations per epoch', upd: 'parameter updates', seen: 'samples used', loss: 'final loss', min: 'optimum', start: 'start' },
    fr: { title: '🎲 Taille de batch : fréquence des mises à jour vs bruit du gradient', hint: 'Une SGD par mini-batchs ajuste une droite y = w·x + b sur 256 exemples ; le graphique montre la trajectoire des paramètres (w, b) sur les lignes de niveau de la perte, ★ est l’optimum. Petits batchs : beaucoup de mises à jour par epoch, mais chaque pas zigzague ; grands batchs : des pas très stables, mais seulement quelques-uns par epoch. Basculez entre « mêmes 2 epochs » et « mêmes 40 mises à jour » pour comparer les deux coûts.', ep: 'mêmes 2 epochs', up: 'mêmes 40 mises à jour', shuf: 'remélanger', it: 'itérations par epoch', upd: 'mises à jour', seen: 'exemples utilisés', loss: 'perte finale', min: 'optimum', start: 'départ' }
  };
  var W = 560, H = 300, N = 256, LR = 0.3, W0 = -1.5, B0 = -2;
  var o = FV.init('fv-batchsize', T, W, H); if (!o) return;
  var mode = 'ep', seed = 7;
  FV.group(o, 'mode', function (v) { mode = v; });
  function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R0 = rng(12345), xs = [], ys = [];
  for (var i = 0; i < N; i++) { var x = 2 * R0() - 1, u = 1 - R0(), v = R0(); xs.push(x); ys.push(2 * x + 1 + 0.6 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)); }
  var Sx = 0, Sxx = 0, Sy = 0, Sxy = 0;
  for (i = 0; i < N; i++) { Sx += xs[i]; Sxx += xs[i] * xs[i]; Sy += ys[i]; Sxy += xs[i] * ys[i]; }
  Sx /= N; Sxx /= N; Sy /= N; Sxy /= N;
  var wS = (Sxy - Sx * Sy) / (Sxx - Sx * Sx), bS = Sy - wS * Sx;
  function loss(w, b) { var s = 0; for (var i = 0; i < N; i++) { var e = w * xs[i] + b - ys[i]; s += e * e; } return s / (2 * N); }
  var Lmin = loss(wS, bS);
  o.q('shuf').addEventListener('click', function () { seed++; o.redraw(); });
  function run(B) {
    var R = rng(seed * 1000 + B), w = W0, b = B0, P = [[w, b]], ups = 0, maxUp = mode === 'ep' ? 2 * Math.ceil(N / B) : 40;
    while (ups < maxUp) {
      var idx = []; for (var i = 0; i < N; i++) idx.push(i);
      for (i = N - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
      for (var s = 0; s < N && ups < maxUp; s += B) {
        var gw = 0, gb = 0, e = Math.min(N, s + B);
        for (i = s; i < e; i++) { var k = idx[i], r = w * xs[k] + b - ys[k]; gw += r * xs[k]; gb += r; }
        w -= LR * gw / (e - s); b -= LR * gb / (e - s); ups++; P.push([w, b]);
      }
    }
    return P;
  }
  var m = FV.map(W, H, [-2.4, 4.4], [-2.6, 2.6], { l: 34, r: 12, t: 12, b: 26 });
  o.draw = function (c) {
    var ctx = o.ctx, B = Math.pow(2, o.v('b'));
    FV.axes(ctx, m, c, { xl: 'w', yl: 'b' });
    // contours of the quadratic loss: L − Lmin = ½ dᵀ H d,  H = [[Sxx, Sx], [Sx, 1]]
    ctx.save(); FV.clip(ctx, m); ctx.strokeStyle = c.muted; ctx.globalAlpha = 0.45; ctx.lineWidth = 1;
    [0.02, 0.1, 0.3, 0.7, 1.3, 2.2, 3.4].forEach(function (lv) {
      ctx.beginPath();
      for (var q = 0; q <= 90; q++) {
        var a = q / 90 * 2 * Math.PI, dx = Math.cos(a), dy = Math.sin(a), qf = Sxx * dx * dx + 2 * Sx * dx * dy + dy * dy, rr = Math.sqrt(2 * lv / qf);
        var X = m.X(wS + rr * dx), Y = m.Y(bS + rr * dy); q ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    var P = run(B);
    ctx.beginPath(); ctx.strokeStyle = c.accent; ctx.lineWidth = P.length > 200 ? 1 : 1.8;
    P.forEach(function (p, k) { k ? ctx.lineTo(m.X(p[0]), m.Y(p[1])) : ctx.moveTo(m.X(p[0]), m.Y(p[1])); });
    ctx.stroke();
    if (P.length <= 120) P.forEach(function (p, k) { if (k) FV.dot(ctx, m.X(p[0]), m.Y(p[1]), 2.6, c.accent); });
    ctx.restore();
    FV.dot(ctx, m.X(W0), m.Y(B0), 5, c.warn);
    FV.label(ctx, o.t.start, m.X(W0) + 8, m.Y(B0) + 4, c.warn);
    var e = P[P.length - 1];
    FV.dot(ctx, m.X(e[0]), m.Y(e[1]), 4.5, c.pink);
    FV.label(ctx, '★', m.X(wS), m.Y(bS) + 6, c.good, 'center', '17px system-ui,sans-serif');
    var ups = P.length - 1;
    o.out('batch size = <b>' + B + '</b>　' + o.t.it + ' ' + Math.ceil(N / B) + '　' + o.t.upd + ' <b>' + ups + '</b>　' + o.t.seen + ' ' + (ups * B).toLocaleString('en-US').replace(/,/g, FV.lang() === 'fr' ? ' ' : ',') +
      '<br>' + o.t.loss + ' <b>' + FV.fmt(loss(e[0], e[1]), 3) + '</b>' + (FV.lang() === 'zh' ? '（' : ' (') + o.t.min + ' ' + FV.fmt(Lmin, 3) + (FV.lang() === 'zh' ? '）' : ')'));
  };
  o.redraw();
})();
</script>
</div>
