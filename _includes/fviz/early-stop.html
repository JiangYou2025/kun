{% include fviz/base.html %}
<div class="fviz" id="fv-es" markdown="0">
<h4 data-t="title"></h4>
<p class="hint" data-t="hint"></p>
<canvas></canvas>
<div class="ctl">
  <label><span data-t="ep"></span><input type="range" data-k="e" min="1" max="300" step="1" value="8"></label>
  <label>patience<input type="range" data-k="p" min="1" max="60" step="1" value="10"></label>
</div>
<p class="out" data-k="out"></p>
<script>
(function () {
  var T = {
    zh: { title: '⏱️ 早停：在验证损失最低处停下', hint: '一个参数很多的模型（40 个高斯基函数）用 SGD 拟合 20 个带噪声的训练点。拖动 epoch 看左边的曲线怎样先学到大致形状、再慢慢去追每个噪声点。右图：训练损失一路下降，验证损失先降后升。早停在验证损失连续 patience 轮没有改善时停下（红线），并回退到最佳轮（绿点）的权重。', ep: '训练轮数 epoch', fit: '第 {e} 轮的模型', loss: '损失 (MSE)', train: '训练损失', val: '验证损失', truth: '真实函数', stop: '早停于第 {s} 轮，回退到第 {b} 轮（验证损失 = {v}）', over: '⚠️ 已经过了最佳点：模型在背训练集的噪声' },
    en: { title: '⏱️ Early stopping: stop where the validation loss is lowest', hint: 'A model with many parameters (40 Gaussian basis functions) is fitted with SGD to 20 noisy training points. Drag the epoch and watch the curve on the left first learn the overall shape, then slowly chase every noisy point. Right: the training loss keeps falling, while the validation loss falls and then rises. Early stopping halts once the validation loss has not improved for patience epochs in a row (red line) and restores the weights of the best epoch (green dot).', ep: 'epoch', fit: 'model at epoch {e}', loss: 'loss (MSE)', train: 'training loss', val: 'validation loss', truth: 'true function', stop: 'stops at epoch {s} and restores epoch {b} (validation loss = {v})', over: '⚠️ past the best point: the model is memorising the noise in the training set' },
    fr: { title: '⏱️ Arrêt précoce : s’arrêter là où la perte de validation est minimale', hint: 'Un modèle à nombreux paramètres (40 fonctions de base gaussiennes) est ajusté par SGD sur 20 points d’entraînement bruités. Faites varier l’époque : la courbe de gauche apprend d’abord la forme générale, puis poursuit lentement chaque point bruité. À droite : la perte d’entraînement ne cesse de baisser, la perte de validation baisse puis remonte. L’arrêt précoce s’arrête dès que la perte de validation ne s’est pas améliorée pendant patience époques consécutives (ligne rouge) et restaure les poids de la meilleure époque (point vert).', ep: 'époque', fit: 'modèle à l’époque {e}', loss: 'perte (MSE)', train: 'perte d’entraînement', val: 'perte de validation', truth: 'vraie fonction', stop: 's’arrête à l’époque {s} et restaure l’époque {b} (perte de validation = {v})', over: '⚠️ au-delà du meilleur point : le modèle apprend par cœur le bruit d’entraînement' }
  };
  var W = 560, H = 290, E = 300, K = 40, WD = 0.1, LR = 0.01;
  var o = FV.init('fv-es', T, W, H); if (!o) return;
  /* small seeded generator so the figure is the same on every visit */
  var seed = 5, R = function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  var G = function () { var u = 1 - R(), v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  var truth = function (x) { return Math.sin(3 * x); };
  var tr = [], va = [], Cs = [], i;
  for (i = 0; i < 20; i++) { var x = -1 + 2 * (i + 0.5) / 20 + 0.05 * G(); tr.push([x, truth(x) + 0.3 * G()]); }
  for (i = 0; i < 60; i++) { x = -1 + 2 * R(); va.push([x, truth(x) + 0.3 * G()]); }
  for (i = 0; i < K; i++) Cs.push(-1.1 + 2.2 * i / (K - 1));
  var phi = function (x) { return Cs.map(function (c) { return Math.exp(-(x - c) * (x - c) / (2 * WD * WD)); }); };
  var f = function (w, x) { var p = phi(x), s = 0; for (var k = 0; k < K; k++) s += w[k] * p[k]; return s; };
  var mse = function (w, P) { return P.reduce(function (a, p) { var e = f(w, p[0]) - p[1]; return a + e * e; }, 0) / P.length; };
  var w = new Array(K).fill(0), Ws = [w.slice()], Ltr = [mse(w, tr)], Lva = [mse(w, va)], idx = tr.map(function (_, j) { return j; });
  for (var e = 1; e <= E; e++) {
    for (i = idx.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    idx.forEach(function (j) { var p = phi(tr[j][0]), r = f(w, tr[j][0]) - tr[j][1]; for (var k = 0; k < K; k++) w[k] -= LR * r * p[k]; });
    Ws.push(w.slice()); Ltr.push(mse(w, tr)); Lva.push(mse(w, va));
  }
  function early(pat) {
    var best = Infinity, be = 0, wait = 0;
    for (var ep = 1; ep <= E; ep++) {
      if (Lva[ep] < best) { best = Lva[ep]; be = ep; wait = 0; }
      else if (++wait >= pat) return [ep, be];
    }
    return [E, be];
  }
  o.draw = function (c) {
    var ctx = o.ctx, ep = o.v('e'), pat = o.v('p'), st = early(pat);
    var m1 = FV.map(W, H, [-1.05, 1.05], [-1.9, 1.9], { l: 30, r: 290, t: 22, b: 24 });
    FV.axes(ctx, m1, c, { xt: [-1, 0, 1] });
    FV.label(ctx, o.t.fit.replace('{e}', ep), m1.p.l, 14, c.text);
    FV.curve(ctx, m1, truth, c.muted, 1.2, [5, 4]);
    va.forEach(function (p) { FV.dot(ctx, m1.X(p[0]), m1.Y(p[1]), 2.4, c.accent2, true); });
    tr.forEach(function (p) { FV.dot(ctx, m1.X(p[0]), m1.Y(p[1]), 3.4, c.text); });
    FV.curve(ctx, m1, function (x) { return f(Ws[ep], x); }, ep > st[1] ? c.warn : c.accent, 2.5);
    var m2 = FV.map(W, H, [0, E], [0, 0.3], { l: 316, r: 10, t: 22, b: 24 });
    FV.axes(ctx, m2, c, { xt: [0, 100, 200, 300], yt: [0, 0.1, 0.2, 0.3] });
    FV.label(ctx, o.t.loss, m2.p.l, 14, c.text);
    [[Ltr, c.text], [Lva, c.accent2]].forEach(function (s) {
      ctx.save(); FV.clip(ctx, m2); ctx.beginPath(); ctx.strokeStyle = s[1]; ctx.lineWidth = 2;
      s[0].forEach(function (v, k) { var X = m2.X(k), Y = m2.Y(v); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke(); ctx.restore();
    });
    FV.label(ctx, o.t.train, m2.X(E) - 4, m2.Y(Ltr[E]) - 6, c.text, 'right');
    FV.label(ctx, o.t.val, m2.X(E) - 4, m2.Y(Lva[E]) - 6, c.accent2, 'right');
    FV.line(ctx, m2.X(st[0]), m2.p.t, m2.X(st[0]), H - m2.p.b, c.bad, 1.5);
    FV.line(ctx, m2.X(ep), m2.p.t, m2.X(ep), H - m2.p.b, c.accent, 1, [3, 3]);
    FV.dot(ctx, m2.X(st[1]), m2.Y(Lva[st[1]]), 5, c.good);
    FV.dot(ctx, m2.X(ep), m2.Y(Lva[ep]), 3.5, c.accent);
    var s = o.t.ep + ' ' + ep + '　' + o.t.train + ' = ' + Ltr[ep].toFixed(3) + '　' + o.t.val + ' = <b>' + Lva[ep].toFixed(3) + '</b><br>patience = ' + pat + ' → ' +
      o.t.stop.replace('{s}', st[0]).replace('{b}', st[1]).replace('{v}', Lva[st[1]].toFixed(3));
    if (ep > st[1] + 5) s += '<br>' + o.t.over;
    o.out(s);
  };
  o.redraw();
})();
</script>
</div>
